name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject known production vulnerabilities
        run: pnpm audit --prod

      - name: Run regression tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Install mobile browser engines for regression tests
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run role-based browser regression tests
        run: pnpm test:e2e
